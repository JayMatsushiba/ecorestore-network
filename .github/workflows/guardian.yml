# Guardian operator — start, stop or inspect the Hedera Guardian quickstart on the
# demonstration host. Manual only: Guardian is not part of this repository's build
# (docs/DEPLOYMENT.md §6) and running twenty containers is a cost decision, so it is
# switched on for a judging window rather than on every push.
#
# The host runs Guardian from its own checkout at /opt/ecorestore/guardian (cloned by
# the CloudFormation user-data at the pinned tag) with deploy/host/guardian.sh, taken
# from the application checkout *as deployed* — this workflow never moves that
# checkout, so it cannot race a deploy; only deploy.yml advances it. Hedera operator
# credentials come from SSM Parameter Store on the host, never from GitHub.
#
# After `up`, run the Deploy workflow (or push to main) so `verify` re-attaches to
# Guardian's network; after `down`, re-deploy so it falls back to the outbox.
name: Guardian

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do with the Guardian quickstart on the host
        type: choice
        required: true
        default: status
        options: [status, up, down, logs]

permissions:
  contents: read
  id-token: write

# Its own group: a pending Guardian action must not be displaced by a push to main
# (deploy.yml). Both host scripts take the same file lock, so they never overlap.
concurrency:
  group: guardian-host
  cancel-in-progress: false

jobs:
  guardian:
    name: guardian ${{ inputs.action }}
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run deploy/host/guardian.sh ${{ inputs.action }} via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          # Same lock as deploy.yml, taken here so the whole operation is serialised
          # with a deploy; guardian.sh sees ECORESTORE_HOST_LOCK and does not re-acquire.
          script="set -euo pipefail
          exec 9>/var/lock/ecorestore-host.lock
          flock -w 900 9 || { echo 'host lock busy' >&2; exit 1; }
          export ECORESTORE_HOST_LOCK=1
          cd /opt/ecorestore/app
          echo \"guardian.sh from deployed commit \$(git rev-parse --short HEAD)\"
          exec deploy/host/guardian.sh $ACTION"
          params=$(jq -cn --arg s "$script" '{commands: [$s], executionTimeout: ["1800"]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "ecorestore guardian $ACTION" \
            --parameters "$params" \
            --query 'Command.CommandId' --output text)
          for _ in $(seq 1 180); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done
          echo "::group::host output"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "::endgroup::"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text >&2
          echo "status: $status"
          [ "$status" = Success ]
