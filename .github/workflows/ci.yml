# Continuous integration — every test suite the repository has, on every branch.
#
# Runs on pull requests and on pushes to branches other than main. Pushes to main
# run it too, through deploy.yml, which calls this workflow before building images
# (workflow_call), so a red suite never ships.
#
# Nothing here touches AWS, Guardian, a chain or the network beyond package installs.
#
# The job names are the status checks main's branch protection requires; renaming one
# means updating the rule (deploy/README.md, "Branch protection").
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  analysis:
    name: analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/pyproject.toml
      - run: pip install -e '.[test]'
      - run: python -m pytest -q

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge test --root contracts -vv

  images:
    # The three images build from a clean checkout. Nothing is pushed; deploy.yml
    # rebuilds with the registry cache and pushes on main only.
    name: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose -f docker-compose.yml -f deploy/docker-compose.aws.yml config --quiet
        env:
          ECR_REGISTRY: 000000000000.dkr.ecr.us-west-2.amazonaws.com
          IMAGE_TAG: ci
      - run: docker compose -f docker-compose.yml build
