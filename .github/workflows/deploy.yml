# Continuous deployment — main → the AWS demonstration host.
#
#   push to main ─► CI (ci.yml) ─► build + push images to ECR ─► SSM Run Command on the
#   EC2 host: check out the deployed commit, pull the images, docker compose up ─► smoke
#   test the public URL.
#
# The host is provisioned once from deploy/cloudformation/demo-host.yml; see
# deploy/README.md. GitHub authenticates to AWS with OIDC (no long-lived AWS keys in
# GitHub), and reaches the host through SSM (no SSH port, no key pair).
#
# Repository configuration this workflow reads:
#   secrets.AWS_DEPLOY_ROLE_ARN   IAM role assumed via OIDC (stack output DeployRoleArn)
#   vars.AWS_REGION               region of the stack
#   vars.EC2_INSTANCE_ID          stack output InstanceId
#   vars.DEMO_URL                 public URL of the demonstration (stack output DemoUrl,
#                                 or https://<domain> once DNS points at the host);
#                                 required — the run fails rather than skip the smoke test
#
# Application secrets never pass through GitHub. The host reads them from SSM
# Parameter Store at deploy time (deploy/host/deploy.sh).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One deployment at a time. GitHub keeps one running and one pending run per group
# and replaces the pending one with a newer run, so intermediate commits may be skipped
# but the newest is always deployed and a running deploy is never cancelled. The group
# is not shared with guardian.yml — a push must not displace a queued Guardian `down`;
# on the host the two scripts serialise with a file lock instead.
concurrency:
  group: deploy-app
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push ${{ matrix.image.name }}
    needs: ci
    runs-on: ubuntu-latest
    environment: demo
    strategy:
      fail-fast: true
      matrix:
        image:
          - name: analysis
            context: ./analysis
            dockerfile: ./analysis/Dockerfile
          - name: verify
            context: .
            dockerfile: ./verify/Dockerfile
          - name: frontend
            context: ./app
            dockerfile: ./app/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/ecorestore/${{ matrix.image.name }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/ecorestore/${{ matrix.image.name }}:latest
          cache-from: type=registry,ref=${{ steps.ecr.outputs.registry }}/ecorestore/${{ matrix.image.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.ecr.outputs.registry }}/ecorestore/${{ matrix.image.name }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  deploy:
    name: Deploy to the demonstration host
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: ${{ vars.DEMO_URL }}
    steps:
      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run deploy/host/deploy.sh on the host via SSM
        id: ssm
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Take the host lock before touching the checkout, so a concurrent Guardian
          # command cannot move it between checkout and deploy; deploy.sh sees
          # ECORESTORE_HOST_LOCK and does not re-acquire. The checkout is advanced to
          # the deployed commit so the script that runs is the one committed alongside
          # these images.
          script="set -euo pipefail
          exec 9>/var/lock/ecorestore-host.lock
          flock -w 900 9 || { echo 'host lock busy' >&2; exit 1; }
          export ECORESTORE_HOST_LOCK=1
          cd /opt/ecorestore/app
          git fetch --quiet origin
          git checkout --quiet --detach $SHA
          exec deploy/host/deploy.sh $SHA"
          params=$(jq -cn --arg s "$script" '{commands: [$s], executionTimeout: ["1500"]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "ecorestore deploy $SHA" \
            --parameters "$params" \
            --query 'Command.CommandId' --output text)
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "SSM command $command_id sent to $INSTANCE_ID"

          # `wait command-executed` gives up after ~20 polls; loop on the status instead.
          for _ in $(seq 1 150); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "::group::host output"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "::endgroup::"
          echo "::group::host stderr"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text
          echo "::endgroup::"
          echo "status: $status"
          [ "$status" = Success ]

      - name: Smoke test the public URL
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DEMO_URL" ]; then
            echo "::error::repository variable DEMO_URL is not set; the deployment cannot be verified" >&2
            exit 1
          fi
          for _ in $(seq 1 12); do
            if curl -fsS --max-time 15 "$DEMO_URL/health" -o health.json; then break; fi
            sleep 5
          done
          jq . health.json
          jq -e '.ok == true and .service == "ecorestore-verify" and .analysis.reachable == true' health.json >/dev/null
          curl -fsS --max-time 15 "$DEMO_URL/" | grep -qi '<div id="root">'
          echo "deployed ${{ github.sha }} to $DEMO_URL"
