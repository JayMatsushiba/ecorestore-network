[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ecorestore-analysis"
version = "1.0.0"
description = "Ecorestore Network — spatial analysis service (controls, parallel trend, DiD, leakage, bootstrap, coverage) and Tier 0 acquisition"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pycryptodome>=3.20",
  # Tier 0 acquisition (batch job, same image)
  "h3>=4.1",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "pystac-client>=0.8",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ecorestore-analysis-server = "ecorestore_analysis.server:main"
ecorestore-acquire = "ecorestore_analysis.acquire:main"

[tool.setuptools.packages.find]
include = ["ecorestore_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
