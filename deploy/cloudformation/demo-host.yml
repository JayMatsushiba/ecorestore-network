AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Ecorestore Network demonstration host: one EC2 instance running the application
  stack (docker-compose.yml + deploy/docker-compose.aws.yml) and, on demand, the Hedera
  Guardian quickstart side by side (docs/DEPLOYMENT.md section 7.7); ECR repositories
  for the three images; and the IAM trust that lets GitHub Actions push images and
  drive the host over SSM without long-lived credentials. Created once by hand
  (deploy/README.md); everything after that is the Deploy workflow.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the host (the default VPC is fine for the demonstration).
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: A public subnet in that VPC (auto-assigns a public IP or is given an EIP here).
  InstanceType:
    Type: String
    Default: t3.xlarge
    Description: Guardian's quickstart wants 16 GB; t3.2xlarge if it swaps (docs/DEPLOYMENT.md section 6).
    AllowedValues: [t3.large, t3.xlarge, t3.2xlarge, m6i.xlarge, m6i.2xlarge, m7i.xlarge, m7i.2xlarge]
  RootVolumeGiB:
    Type: Number
    Default: 80
    MinValue: 40
    Description: gp3 root volume. Guardian images plus MongoDB and IPFS data sit here.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 (SSM agent and AWS CLI preinstalled).
  GitHubRepository:
    Type: String
    Default: JayMatsushiba/ecorestore-network
    Description: owner/name of the repository whose main branch may deploy.
  GitHubBranch:
    Type: String
    Default: main
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set false if this account already has token.actions.githubusercontent.com as an OIDC provider.
  GuardianRepository:
    Type: String
    Default: https://github.com/hashgraph/guardian
  GuardianTag:
    Type: String
    Default: "3.7.0"
    Description: Guardian tag to clone; the version this project is tested against (docs/GUARDIAN.md).
  GuardianUiCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: >-
      CIDR allowed to reach the Guardian UI on port 3000. Empty string closes the port
      (Guardian is then reachable only from the host). Only the web proxy is ever
      published; the api-gateway and data stores stay internal.
    AllowedPattern: ^$|^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$

Conditions:
  CreateOidc: !Equals [!Ref CreateGitHubOidcProvider, "true"]
  ExposeGuardianUi: !Not [!Equals [!Ref GuardianUiCidr, ""]]

Resources:
  # ---------------------------------------------------------------- images ----
  AnalysisRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: ecorestore/analysis
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep the last 10","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'
  VerifyRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: ecorestore/verify
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep the last 10","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'
  FrontendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: ecorestore/frontend
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep the last 10","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  # ------------------------------------------------------ GitHub → AWS trust ----
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      # GitHub's OIDC issuer is validated against its CA by AWS since 2023; the
      # thumbprint is still a required field.
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-github-deploy
      Description: Assumed by GitHub Actions (deploy.yml, guardian.yml) via OIDC.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidcProvider
                - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Pushes to the deploy branch, and jobs bound to the "demo" environment.
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepository}:ref:refs/heads/${GitHubBranch}
                  - !Sub repo:${GitHubRepository}:environment:demo
      Policies:
        - PolicyName: push-images
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:DescribeImages
                Resource:
                  - !GetAtt AnalysisRepository.Arn
                  - !GetAtt VerifyRepository.Arn
                  - !GetAtt FrontendRepository.Arn
        - PolicyName: drive-host-over-ssm
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Host}
                  - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                  - ssm:ListCommands
                Resource: "*"

  # --------------------------------------------------------------- the host ----
  HostRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-host
      Description: Instance role - SSM agent, ECR pull, and this project's parameters. No write access anywhere.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
        - PolicyName: read-parameters
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParametersByPath
                  - ssm:GetParameters
                  - ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ecorestore/*
              # SecureString parameters under the account's default SSM key.
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com

  HostProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref HostRole]

  HostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Ecorestore demo host - HTTP and HTTPS to the edge proxy; no SSH (SSM only)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }
        - { IpProtocol: udp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTP/3 }
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}" }

  GuardianUiIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: ExposeGuardianUi
    Properties:
      GroupId: !Ref HostSecurityGroup
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      CidrIp: !Ref GuardianUiCidr
      Description: Guardian web proxy (UI and /api/v1) - deploy/guardian/docker-compose.public.yml

  Host:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref HostSecurityGroup]
      IamInstanceProfile: !Ref HostProfile
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeGiB
            DeleteOnTermination: true
            Encrypted: true
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}" }
        - { Key: Project, Value: ecorestore-network }
      # Bootstrap: Docker + the compose plugin, the application checkout the deploy
      # workflow advances, and the Guardian checkout at the pinned tag. Idempotent and
      # secret-free; secrets are read from Parameter Store at deploy time.
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker git jq python3
          systemctl enable --now docker

          # Docker Compose v2 plugin (AL2023 does not package it). !reset / !override in
          # the compose overlays need >= 2.24.
          mkdir -p /usr/local/lib/docker/cli-plugins
          arch=$(uname -m)
          curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-${!arch}" \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          docker compose version

          mkdir -p /opt/ecorestore
          if [ ! -d /opt/ecorestore/app/.git ]; then
            git clone --branch ${GitHubBranch} https://github.com/${GitHubRepository}.git /opt/ecorestore/app
          fi
          if [ ! -d /opt/ecorestore/guardian/.git ]; then
            git clone --depth 1 --branch ${GuardianTag} ${GuardianRepository} /opt/ecorestore/guardian
          fi
          # Keep the stack alive across reboots without the deploy workflow: compose's
          # restart policies do the rest once Docker starts.
          echo "bootstrap complete $(date -Is)" > /opt/ecorestore/BOOTSTRAPPED

  HostAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Host
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}" }

Outputs:
  InstanceId:
    Description: GitHub variable EC2_INSTANCE_ID
    Value: !Ref Host
  DeployRoleArn:
    Description: GitHub secret AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  EcrRegistry:
    Description: SSM parameter /ecorestore/demo/ECR_REGISTRY
    Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
  PublicIp:
    Description: Point a DNS A record here to serve HTTPS (parameter /ecorestore/demo/DOMAIN)
    Value: !Ref HostAddress
  DemoUrl:
    Description: GitHub variable DEMO_URL until a domain is configured
    Value: !Sub http://${HostAddress}
  GuardianUrl:
    Description: Guardian UI once the Guardian workflow has run `up`
    Value: !Sub http://${HostAddress}:3000
