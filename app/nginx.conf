# Serves the built React app and proxies the verify service under /api/.
# The frontend never reaches the analysis service, Guardian or a chain
# directly; verify is the only backend it knows.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # A verification run can take several seconds (bootstrap + placebos + chain).
    location /api/ {
        proxy_pass http://verify:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://verify:8080/health;
        proxy_read_timeout 15s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
