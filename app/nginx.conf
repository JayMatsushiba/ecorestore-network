# Serves the built React app and proxies the demo API under /api/.
# The API server (server/) is the one backend the browser knows; that server
# is read-only and holds no signing key, and the UI never reaches the chain,
# Graph Node or Guardian directly (CLAUDE.md). The only other hosts the page
# contacts are the public map-tile servers the Overview map draws from
# (tile.openstreetmap.org, tiles.maps.eox.at — see app/src/components/ProjectMap.tsx).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
